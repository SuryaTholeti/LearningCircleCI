version: 2.1

jobs:
  salesforce-lwc-ci:
    docker:
      - image: cimg/node:22.14

    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Run LWC Jest tests
          command: npm test

      - run:
          name: Run ESLint
          command: npm run lint
