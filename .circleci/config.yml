version: 2.1

jobs:
  deploy:
    parameters:
      username:
        type: env_var_name
      client_id:
        type: env_var_name
      instance_url:
        type: env_var_name
      jwt_key:
        type: env_var_name
      environment:
        type: enum
        enum: ["auto", "qa", "uat", "prod"]
      mode:
        type: enum
        enum: ["validate", "deploy"]

    docker:
      - image: cimg/node:22.17

    working_directory: ~/project

    steps:
      - checkout

      # -----------------------------------------------
      # 1. INSTALL SALESFORCE CLI AND REQUIRED TOOLS
      # -----------------------------------------------      
      
      - run:
          name: Install Salesforce CLI and Tools
          command: |
            set -euo pipefail

            # Install Salesforce CLI
            sudo npm install -g @salesforce/cli@2.143.6

            # Install Java and jq
            sudo apt-get update -qq
            sudo apt-get install -y openjdk-17-jdk jq

            # Configure Java
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            export PATH="$JAVA_HOME/bin:$PATH"

            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"

            # Configure trusted unsigned plugins
            mkdir -p "$HOME/.config/sf"

            printf '%s\n' \
              '["sfdx-git-delta","@salesforce/plugin-code-analyzer"]' \
              > "$HOME/.config/sf/unsignedPluginAllowList.json"

            # Install required plugins
            sf plugins install sfdx-git-delta
            sf plugins install @salesforce/plugin-code-analyzer

            # Verify installations
            sf --version
            sf plugins
            java -version
            sf code-analyzer --help



      # -----------------------------------------------
      # 2. RESOLVE TARGET ENVIRONMENT
      # -----------------------------------------------
      - run:
          name: Resolve Target Environment
          command: |
            set -euo pipefail

            MODE="<< parameters.mode >>"
            ENVIRONMENT="<< parameters.environment >>"

            IS_PR="false"
            BASE_BRANCH=""

            if [ "$MODE" = "validate" ] &&
               [ "$ENVIRONMENT" = "auto" ]; then

              if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
                echo "ERROR: A pull request URL is required for auto validation."
                echo "Ensure CircleCI is configured to build pull requests."
                exit 1
              fi

              if [ -z "${GH_API_TOKEN:-}" ]; then
                echo "ERROR: GH_API_TOKEN is not configured."
                exit 1
              fi

              PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"

              PR_JSON=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_API_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${PR_NUMBER}")

              BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')

              case "$BASE_BRANCH" in
                qa|uat|main)
                  IS_PR="true"
                  ;;
                *)
                  echo "PR targets '${BASE_BRANCH}'."
                  echo "This pipeline validates only PRs targeting qa, uat, or main."
                  exit 0
                  ;;
              esac

              case "$BASE_BRANCH" in
                qa) ENVIRONMENT="qa" ;;
                uat) ENVIRONMENT="uat" ;;
                main) ENVIRONMENT="prod" ;;
              esac

            else
              case "$ENVIRONMENT" in
                qa) BASE_BRANCH="qa" ;;
                uat) BASE_BRANCH="uat" ;;
                prod) BASE_BRANCH="main" ;;
                *)
                  echo "ERROR: Unsupported environment: $ENVIRONMENT"
                  exit 1
                  ;;
              esac
            fi

            {
              echo "export PIPELINE_MODE='${MODE}'"
              echo "export TARGET_ENVIRONMENT='${ENVIRONMENT}'"
              echo "export BASE_BRANCH='${BASE_BRANCH}'"
              echo "export IS_PR='${IS_PR}'"
            } >> "$BASH_ENV"

            echo "Pipeline mode: ${MODE}"
            echo "Target environment: ${ENVIRONMENT}"
            echo "Base branch: ${BASE_BRANCH}"
            echo "Pull request validation: ${IS_PR}"

      # -----------------------------------------------
      # 3. FETCH HISTORY AND GENERATE DELTA
      # -----------------------------------------------
      - run:
          name: Generate Salesforce Delta
          command: |
            set -euo pipefail

            mkdir -p delta

            git fetch origin --prune

            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow origin
            fi

            if [ "$IS_PR" = "true" ]; then
              git fetch origin "$BASE_BRANCH"

              FROM_COMMIT=$(git merge-base HEAD "origin/${BASE_BRANCH}")
            else
              if ! git rev-parse HEAD^ >/dev/null 2>&1; then
                echo "No previous commit exists. No delta can be generated."
                echo "export HAS_DELTA=false" >> "$BASH_ENV"
                echo "export HAS_CHANGES=false" >> "$BASH_ENV"
                exit 0
              fi

              FROM_COMMIT="HEAD^"
            fi

            echo "Comparing ${FROM_COMMIT} with HEAD"

            sf sgd source delta \
              --from "$FROM_COMMIT" \
              --to HEAD \
              --output-dir delta \
              --source-dir force-app/main/default \
              --generate-delta

            echo "===== GENERATED PACKAGE.XML ====="

            if [ -f delta/package/package.xml ]; then
              cat delta/package/package.xml
            else
              echo "No package.xml generated."
            fi

            HAS_DELTA="false"
            HAS_CHANGES="false"

            if [ -f delta/package/package.xml ] &&
               grep -q "<members>" delta/package/package.xml; then
              HAS_DELTA="true"
              HAS_CHANGES="true"
            fi

            # Check whether destructive change manifests were generated.
            for FILE in \
              delta/destructiveChanges/destructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPre.xml \
              delta/destructiveChanges/destructiveChangesPost.xml \
              delta/destructiveChanges/preDestructiveChanges.xml \
              delta/destructiveChanges/postDestructiveChanges.xml
            do
              if [ -f "$FILE" ]; then
                HAS_CHANGES="true"
              fi
            done

            {
              echo "export HAS_DELTA='${HAS_DELTA}'"
              echo "export HAS_CHANGES='${HAS_CHANGES}'"
            } >> "$BASH_ENV"

            echo "HAS_DELTA=${HAS_DELTA}"
            echo "HAS_CHANGES=${HAS_CHANGES}"

      
      
      # -----------------------------------------------
      # 4. PMD SCAN, REPORTS AND QUALITY GATE
      # -----------------------------------------------
      - run:
          name: PMD Scan, Severity Report and Quality Gate
          command: |
            set -uo pipefail

            mkdir -p pmd-output
            rm -f pmd-output/pmd-report.json \
                  pmd-output/pmd-summary.html \
                  pmd-output/findings.json \
                  pmd-output/classified.json \
                  pmd-output/scanner.log

            DELTA_PATH="delta/force-app/main/default"
            FULL_PATH="force-app/main/default"
            SCAN_STATUS=0
            PARSE_STATUS=0

            # -----------------------------------------
            # Select delta scan or full scan
            # -----------------------------------------
            if [ -d "$DELTA_PATH" ] && \
              find "$DELTA_PATH" -type f \( \
                -name "*.cls" -o \
                -name "*.trigger" -o \
                -name "*.js" -o \
                -name "*.html" -o \
                -name "*.css" -o \
                -name "*.cmp" -o \
                -name "*.app" -o \
                -name "*.evt" -o \
                -name "*.intf" \
              \) -print -quit | grep -q .; then

              TARGET_PATH="$DELTA_PATH"
              SCAN_MODE="Delta Scan"

            else
              TARGET_PATH="$FULL_PATH"
              SCAN_MODE="Full Scan"
            fi

            echo "============================================"
            echo "Salesforce Code Analyzer - PMD"
            echo "Scan mode   : ${SCAN_MODE}"
            echo "Scan target : ${TARGET_PATH}"
            echo "============================================"

            if [ ! -d "$TARGET_PATH" ]; then
              echo "ERROR: Scan target does not exist: ${TARGET_PATH}"
              SCAN_STATUS=1
            else

              # ---------------------------------------
              # Run Salesforce Code Analyzer v5
              # ---------------------------------------
              echo "Starting PMD scan..."

              sf code-analyzer run \
                --rule-selector pmd \
                --workspace "$TARGET_PATH" \
                --output-file pmd-output/pmd-report.json \
                2>&1 | tee pmd-output/scanner.log

              SCAN_STATUS=${PIPESTATUS[0]}

              echo "Scanner exit code: ${SCAN_STATUS}"
            fi

            # -----------------------------------------
            # Preserve a report if the scanner fails
            # -----------------------------------------
            if [ ! -s pmd-output/pmd-report.json ]; then
              echo "WARNING: Scanner did not produce a JSON report."
              PARSE_STATUS=1
              printf '{"violations":[]}\n' \
                > pmd-output/pmd-report.json
            fi

            if ! jq -e . pmd-output/pmd-report.json \
              >/dev/null 2>&1; then

              echo "ERROR: Scanner report is not valid JSON."
              PARSE_STATUS=1
              printf '{"violations":[]}\n' \
                > pmd-output/pmd-report.json
            fi

            # -----------------------------------------
            # Normalize common JSON report structures
            # -----------------------------------------
            if [ "$PARSE_STATUS" -eq 0 ]; then
              if ! jq '
                if type == "array" then
                  [
                    .[] |
                    if type == "object" and
                       (.violations | type == "array") then
                      .violations[]
                    else
                      .
                    end
                  ]
                elif type == "object" and
                     (.violations | type == "array") then
                  .violations
                else
                  error("Unrecognized report structure")
                end
                | map(select(type == "object"))
              ' pmd-output/pmd-report.json \
                > pmd-output/findings.json; then

                echo "ERROR: Cannot parse Code Analyzer JSON structure."
                PARSE_STATUS=1
                printf '[]\n' > pmd-output/findings.json
              fi
            else
              printf '[]\n' > pmd-output/findings.json
            fi

            # -----------------------------------------
            # Classify High, Medium and Low findings
            # PMD numeric priorities: 1-2 High,
            # 3 Medium, 4-5 Low.
            # -----------------------------------------
            if [ "$PARSE_STATUS" -eq 0 ]; then
              if ! jq '
                map(
                  . as $v |
                  (
                    ($v.severity // $v.priority //
                     $v.ruleSeverity // "unknown")
                    | tostring
                    | ascii_downcase
                  ) as $s |
                  $v + {
                    pipelineSeverity:
                      if ($s == "1" or $s == "2" or
                          $s == "high" or
                          $s == "critical" or
                          $s == "error") then "High"
                      elif ($s == "3" or
                            $s == "medium" or
                            $s == "moderate" or
                            $s == "warning") then "Medium"
                      elif ($s == "4" or $s == "5" or
                            $s == "low" or
                            $s == "info" or
                            $s == "informational") then "Low"
                      else "Unknown"
                      end
                  }
                )
              ' pmd-output/findings.json \
                > pmd-output/classified.json; then

                echo "ERROR: Failed to classify findings."
                PARSE_STATUS=1
                printf '[]\n' > pmd-output/classified.json
              fi
            else
              printf '[]\n' > pmd-output/classified.json
            fi

            # -----------------------------------------
            # Calculate severity counts
            # -----------------------------------------
            HIGH_COUNT=$(jq \
              '[.[] | select(.pipelineSeverity == "High")] | length' \
              pmd-output/classified.json)

            MEDIUM_COUNT=$(jq \
              '[.[] | select(.pipelineSeverity == "Medium")] | length' \
              pmd-output/classified.json)

            LOW_COUNT=$(jq \
              '[.[] | select(.pipelineSeverity == "Low")] | length' \
              pmd-output/classified.json)

            UNKNOWN_COUNT=$(jq \
              '[.[] | select(.pipelineSeverity == "Unknown")] | length' \
              pmd-output/classified.json)

            TOTAL_COUNT=$(jq 'length' pmd-output/classified.json)

            # -----------------------------------------
            # Console summary
            # -----------------------------------------
            echo ""
            echo "============================================"
            echo "          PMD SUMMARY OVERVIEW"
            echo "============================================"
            echo "Scan mode       : ${SCAN_MODE}"
            echo "High severity   : ${HIGH_COUNT}"
            echo "Medium severity : ${MEDIUM_COUNT}"
            echo "Low severity    : ${LOW_COUNT}"
            echo "Unknown severity: ${UNKNOWN_COUNT}"
            echo "Total findings  : ${TOTAL_COUNT}"
            echo "============================================"

            # -----------------------------------------
            # Generate custom HTML report
            # -----------------------------------------
            {
              echo '<!doctype html>'
              echo '<html><head><meta charset="utf-8">'
              echo '<title>Salesforce PMD Report</title>'
              echo '<style>'
              echo 'body{font-family:Arial,sans-serif;margin:24px}'
              echo '.card{display:inline-block;padding:16px;margin:6px;border-radius:8px;color:white}'
              echo '.high{background:#c62828}'
              echo '.medium{background:#ef6c00}'
              echo '.low{background:#2e7d32}'
              echo '.unknown{background:#616161}'
              echo 'table{border-collapse:collapse;width:100%;margin-top:20px}'
              echo 'td,th{border:1px solid #ddd;padding:8px;text-align:left}'
              echo '</style></head><body>'
              echo '<h1>Salesforce PMD Scan Report</h1>'
              printf '<p>Scan mode: %s</p>\n' "$SCAN_MODE"
              printf '<p>Scan target: %s</p>\n' "$TARGET_PATH"
              printf '<div class="card high">High: %s</div>\n' "$HIGH_COUNT"
              printf '<div class="card medium">Medium: %s</div>\n' "$MEDIUM_COUNT"
              printf '<div class="card low">Low: %s</div>\n' "$LOW_COUNT"
              printf '<div class="card unknown">Unknown: %s</div>\n' "$UNKNOWN_COUNT"
              echo '<table><tr><th>Severity</th><th>Rule</th><th>Message</th><th>File</th><th>Line</th></tr>'
            } > pmd-output/pmd-summary.html

            html_escape() {
              printf '%s' "$1" |
                sed \
                  -e 's/\&/\&amp;/g' \
                  -e 's/</\&lt;/g' \
                  -e 's/>/\&gt;/g' \
                  -e 's/"/\&quot;/g'
            }

            while IFS= read -r FINDING; do
              SEVERITY=$(printf '%s' "$FINDING" |
                jq -r '.pipelineSeverity // "Unknown"')
              RULE=$(printf '%s' "$FINDING" |
                jq -r '.ruleName // .rule // .ruleId // "Unknown"')
              MESSAGE=$(printf '%s' "$FINDING" |
                jq -r '.message // .description // ""')
              FILE=$(printf '%s' "$FINDING" |
                jq -r '.fileName // .file // .uri // ""')
              LINE=$(printf '%s' "$FINDING" |
                jq -r '.line // .lineNumber // ""')

              RULE=$(html_escape "$RULE")
              MESSAGE=$(html_escape "$MESSAGE")
              FILE=$(html_escape "$FILE")

              printf '<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>\n' \
                "$SEVERITY" "$RULE" "$MESSAGE" "$FILE" "$LINE" \
                >> pmd-output/pmd-summary.html

            done < <(jq -c '.[]' pmd-output/classified.json)

            echo '</table></body></html>' \
              >> pmd-output/pmd-summary.html

            # -----------------------------------------
            # Enforce quality gate in the SAME step
            # -----------------------------------------
            echo ""
            echo "============================================"
            echo "          PMD QUALITY GATE"
            echo "============================================"

            if [ "$SCAN_STATUS" -ne 0 ]; then
              echo "FAILED: Code Analyzer returned an error."
            elif [ "$PARSE_STATUS" -ne 0 ]; then
              echo "FAILED: PMD report could not be parsed."
            elif [ "$UNKNOWN_COUNT" -gt 0 ]; then
              echo "FAILED: Some findings have unrecognized severity."
            elif [ "$HIGH_COUNT" -gt 0 ]; then
              echo "FAILED: High-severity findings detected."
            else
              echo "PASSED: No High-severity findings detected."
            fi

            echo "Scanner status : ${SCAN_STATUS}"
            echo "Report status  : ${PARSE_STATUS}"

            # Preserve counts for troubleshooting in later steps.
            {
              echo "export PMD_SCAN_STATUS='${SCAN_STATUS}'"
              echo "export PMD_PARSE_STATUS='${PARSE_STATUS}'"
              echo "export PMD_HIGH_COUNT='${HIGH_COUNT}'"
              echo "export PMD_MEDIUM_COUNT='${MEDIUM_COUNT}'"
              echo "export PMD_LOW_COUNT='${LOW_COUNT}'"
              echo "export PMD_UNKNOWN_COUNT='${UNKNOWN_COUNT}'"
            } >> "$BASH_ENV"

            if [ "$SCAN_STATUS" -ne 0 ] ||
               [ "$PARSE_STATUS" -ne 0 ] ||
               [ "$UNKNOWN_COUNT" -gt 0 ] ||
               [ "$HIGH_COUNT" -gt 0 ]; then
              exit 1
            fi

            exit 0

      # -----------------------------------------------
      # 5. PUBLISH PMD REPORTS AND DELTA ARTIFACTS
      # -----------------------------------------------
      - store_artifacts:
          path: pmd-output
          destination: salesforce-pmd-report

      - store_artifacts:
          path: delta
          destination: salesforce-delta      

      # -----------------------------------------------
      # 6. AUTHENTICATE TO THE TARGET ORG
      # -----------------------------------------------
      - run:
          name: Authenticate Salesforce with JWT
          command: |
            set -euo pipefail

            case "$TARGET_ENVIRONMENT" in
              qa)
                USERNAME_ENV="SF_QA_USERNAME"
                CLIENT_ID_ENV="SF_QA_CLIENT_ID"
                INSTANCE_URL_ENV="SF_QA_INSTANCE_URL"
                JWT_ENV="JWT_KEY_QA"
                ;;
              uat)
                USERNAME_ENV="SF_UAT_USERNAME"
                CLIENT_ID_ENV="SF_UAT_CLIENT_ID"
                INSTANCE_URL_ENV="SF_UAT_INSTANCE_URL"
                JWT_ENV="JWT_KEY_UAT"
                ;;
              prod)
                USERNAME_ENV="SF_PROD_USERNAME"
                CLIENT_ID_ENV="SF_PROD_CLIENT_ID"
                INSTANCE_URL_ENV="SF_PROD_INSTANCE_URL"
                JWT_ENV="JWT_KEY_PROD"
                ;;
              *)
                echo "ERROR: Unsupported target environment."
                exit 1
                ;;
            esac

            USERNAME="${!USERNAME_ENV:-}"
            CLIENT_ID="${!CLIENT_ID_ENV:-}"
            INSTANCE_URL="${!INSTANCE_URL_ENV:-}"
            JWT_B64="${!JWT_ENV:-}"

            if [ -z "$USERNAME" ] ||
               [ -z "$CLIENT_ID" ] ||
               [ -z "$INSTANCE_URL" ] ||
               [ -z "$JWT_B64" ]; then
              echo "ERROR: One or more Salesforce environment variables are missing."
              exit 1
            fi

            KEY_FILE="$PWD/circleci.key"

            printf '%s' "$JWT_B64" | base64 --decode > "$KEY_FILE"
            chmod 600 "$KEY_FILE"

            sf org login jwt \
              --client-id "$CLIENT_ID" \
              --jwt-key-file "$KEY_FILE" \
              --username "$USERNAME" \
              --instance-url "$INSTANCE_URL" \
              --alias targetorg

            rm -f "$KEY_FILE"

      # -----------------------------------------------
      # 7. VALIDATE OR DEPLOY
      # -----------------------------------------------
      - run:
          name: Salesforce Dry Run Validation or Deployment
          command: |
            set -euo pipefail

            if [ "$HAS_CHANGES" != "true" ]; then
              echo "No deployable metadata changes detected."
              exit 0
            fi

            PKG_FILE="delta/package/package.xml"

            PRE_XML=""
            POST_XML=""

            # Support common destructive manifest naming conventions.
            for FILE in \
              delta/destructiveChanges/preDestructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPre.xml
            do
              if [ -f "$FILE" ]; then
                PRE_XML="$FILE"
                break
              fi
            done

            for FILE in \
              delta/destructiveChanges/postDestructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPost.xml \
              delta/destructiveChanges/destructiveChanges.xml
            do
              if [ -f "$FILE" ]; then
                POST_XML="$FILE"
                break
              fi
            done

            # Use the generated manifest when available.
            if [ -f "$PKG_FILE" ] &&
               grep -q "<members>" "$PKG_FILE"; then

              DEPLOY_ARGS=(--manifest "$PKG_FILE")

            elif [ -d "delta/force-app/main/default" ]; then

              echo "Using the generated delta source directory."
              DEPLOY_ARGS=(--source-dir delta/force-app/main/default)

            else
              echo "ERROR: Changes were detected, but no deployable delta was generated."
              echo "Refusing to deploy the entire force-app directory as a fallback."
              exit 1
            fi

            # Destructive changes require a deployment manifest.
            if [ -n "$PRE_XML" ] || [ -n "$POST_XML" ]; then
              if [ ! -f "$PKG_FILE" ]; then
                echo "ERROR: Destructive changes require a package manifest."
                exit 1
              fi

              DEPLOY_ARGS=(--manifest "$PKG_FILE")
            fi

            if [ -n "$PRE_XML" ]; then
              DEPLOY_ARGS+=(--pre-destructive-changes "$PRE_XML")
            fi

            if [ -n "$POST_XML" ]; then
              DEPLOY_ARGS+=(--post-destructive-changes "$POST_XML")
            fi

            echo "Environment: ${TARGET_ENVIRONMENT}"
            echo "Mode: ${PIPELINE_MODE}"
            echo "Test level: RunLocalTests"

            COMMON_ARGS=(
              --target-org targetorg
              --test-level RunLocalTests
              --wait 800
              --ignore-warnings
              --verbose
            )

            if [ "$PIPELINE_MODE" = "validate" ]; then
              echo "Starting Salesforce dry-run validation..."

              sf project deploy start \
                "${DEPLOY_ARGS[@]}" \
                "${COMMON_ARGS[@]}" \
                --dry-run
            else
              echo "Starting Salesforce deployment..."

              sf project deploy start \
                "${DEPLOY_ARGS[@]}" \
                "${COMMON_ARGS[@]}"
            fi

      # -----------------------------------------------
      # 8. SAVE REPORTS AND DELTA ARTIFACTS
      # -----------------------------------------------
      - when:
          condition:
            equal: ["always", "always"]
          steps:
            - store_artifacts:
                path: pmd-output
                destination: salesforce-pmd-report

            - store_artifacts:
                path: delta
                destination: salesforce-delta

      # -----------------------------------------------
      # 9. CLEAN UP JWT KEY
      # -----------------------------------------------
      - run:
          name: Cleanup JWT Key
          when: always
          command: |
            rm -f circleci.key


workflows:
  version: 2

  # -----------------------------------------------
  # PR VALIDATION
  # -----------------------------------------------
  pull_request_validation:
    jobs:
      - deploy:
          name: validate-pull-request
          username: SF_QA_USERNAME
          client_id: SF_QA_CLIENT_ID
          instance_url: SF_QA_INSTANCE_URL
          jwt_key: JWT_KEY_QA
          environment: auto
          mode: validate
          filters:
            branches:
              only: /^(feature|release|sprint|HotFix)\/.+$/

  # -----------------------------------------------
  # QA DEPLOYMENT
  # -----------------------------------------------
  deploy_qa:
    jobs:
      - deploy:
          name: deploy-qa
          username: SF_QA_USERNAME
          client_id: SF_QA_CLIENT_ID
          instance_url: SF_QA_INSTANCE_URL
          jwt_key: JWT_KEY_QA
          environment: qa
          mode: deploy
          filters:
            branches:
              only: qa

  # -----------------------------------------------
  # UAT DEPLOYMENT
  # -----------------------------------------------
  deploy_uat:
    jobs:
      - deploy:
          name: deploy-uat
          username: SF_UAT_USERNAME
          client_id: SF_UAT_CLIENT_ID
          instance_url: SF_UAT_INSTANCE_URL
          jwt_key: JWT_KEY_UAT
          environment: uat
          mode: deploy
          filters:
            branches:
              only: uat

  # -----------------------------------------------
  # PRODUCTION VALIDATION, APPROVAL AND DEPLOYMENT
  # -----------------------------------------------
  deploy_production:
    jobs:
      - deploy:
          name: validate-production
          username: SF_PROD_USERNAME
          client_id: SF_PROD_CLIENT_ID
          instance_url: SF_PROD_INSTANCE_URL
          jwt_key: JWT_KEY_PROD
          environment: prod
          mode: validate
          filters:
            branches:
              only: main

      - approve-prod:
          type: approval
          requires:
            - validate-production
          filters:
            branches:
              only: main

      - deploy:
          name: deploy-prod
          username: SF_PROD_USERNAME
          client_id: SF_PROD_CLIENT_ID
          instance_url: SF_PROD_INSTANCE_URL
          jwt_key: JWT_KEY_PROD
          environment: prod
          mode: deploy
          requires:
            - approve-prod
          filters:
            branches:
              only: main
