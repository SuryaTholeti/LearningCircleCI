version: 2.1

jobs:
  deploy:
    parameters:
      environment:
        type: enum
        enum: ["auto", "qa", "uat", "prod"]
      mode:
        type: enum
        enum: ["validate", "deploy"]
      test_level:
        type: string

    docker:
      - image: cimg/node:22.17

    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Install Salesforce CLI and tools
          command: |
            set -euo pipefail
            sudo npm install --global @salesforce/cli@2.143.6
            sudo apt-get update && sudo apt-get install --yes jq
            echo y | sf plugins install sfdx-git-delta
            echo y | sf plugins install @salesforce/sfdx-scanner
            sf --version

      - run:
          name: Resolve Target Branch and Environment
          command: |
            set -euo pipefail
            MODE="<< parameters.mode >>"
            ENVIRONMENT="<< parameters.environment >>"
            IS_PR="false"

            if [ "$MODE" = "validate" ] && [ "$ENVIRONMENT" = "auto" ]; then
              : "${CIRCLE_PULL_REQUEST:?PR URL is required for validation}"
              : "${GH_API_TOKEN:?Set GH_API_TOKEN in CircleCI}"
              PR_NUMBER="${CIRCLE_PULL_REQUEST##*/}"
              PR_DATA=$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${PR_NUMBER}")
              BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.base.ref')
              IS_PR="true"
              case "$BASE_BRANCH" in
                qa|QA) ENVIRONMENT="qa" ;;
                uat|UAT) ENVIRONMENT="uat" ;;
                main) ENVIRONMENT="prod" ;;
                *) echo "Unsupported PR target: $BASE_BRANCH"; exit 1 ;;
              esac
            else
              case "$ENVIRONMENT" in
                qa) BASE_BRANCH="qa" ;;
                uat) BASE_BRANCH="uat" ;;
                prod) BASE_BRANCH="main" ;;
                *) echo "Unsupported environment: $ENVIRONMENT"; exit 1 ;;
              esac
            fi

            echo "export PIPELINE_MODE='$MODE'" >> "$BASH_ENV"
            echo "export TARGET_ENVIRONMENT='$ENVIRONMENT'" >> "$BASH_ENV"
            echo "export BASE_BRANCH='$BASE_BRANCH'" >> "$BASH_ENV"
            echo "export IS_PR='$IS_PR'" >> "$BASH_ENV"
            echo "Target branch: $BASE_BRANCH; environment: $ENVIRONMENT; mode: $MODE"

      - run:
          name: Fetch Git History and Generate Delta
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            git fetch origin --prune
            git fetch --unshallow 2>/dev/null || true
            git fetch origin "$BASE_BRANCH" --depth=100

            if [ -n "${COMMIT_ID:-}" ]; then
              FROM_COMMIT="$COMMIT_ID"
            elif [ "$IS_PR" = "true" ]; then
              FROM_COMMIT=$(git merge-base HEAD "origin/$BASE_BRANCH")
            else
              FROM_COMMIT=$(git rev-parse HEAD^ 2>/dev/null || true)
            fi

            if [ -z "${FROM_COMMIT:-}" ]; then echo "Unable to determine delta baseline."; exit 1; fi
            echo "export FROM_COMMIT='$FROM_COMMIT'" >> "$BASH_ENV"
            rm -rf delta && mkdir -p delta reports

            sf sgd source delta --from "$FROM_COMMIT" --to HEAD --output-dir delta --generate-delta

            CHANGED_FILES=$(git diff --name-only "$FROM_COMMIT" HEAD -- | grep '^force-app/' || true)
            echo "$CHANGED_FILES" > reports/changed-files.txt

            if [ -f delta/package/package.xml ] && grep -q '<members>' delta/package/package.xml; then
              echo "export HAS_DELTA=true" >> "$BASH_ENV"
              cp delta/package/package.xml reports/delta-package.xml
            else
              echo "export HAS_DELTA=false" >> "$BASH_ENV"
            fi

            mkdir -p delta/destructiveChanges
            for FILE in preDestructiveChanges.xml postDestructiveChanges.xml; do
              if [ -f "destructiveChanges/$FILE" ]; then cp "destructiveChanges/$FILE" "delta/destructiveChanges/$FILE"; fi
            done

            if [ -f delta/destructiveChanges/destructiveChanges.xml ] && [ ! -f delta/destructiveChanges/postDestructiveChanges.xml ]; then cp delta/destructiveChanges/destructiveChanges.xml delta/destructiveChanges/postDestructiveChanges.xml; fi

            if [ -f delta/destructiveChanges/preDestructiveChanges.xml ] || [ -f delta/destructiveChanges/postDestructiveChanges.xml ]; then
              echo "export HAS_DESTRUCTIVE=true" >> "$BASH_ENV"
            else
              echo "export HAS_DESTRUCTIVE=false" >> "$BASH_ENV"
            fi

            if [ -n "$CHANGED_FILES" ]; then echo "export HAS_CHANGED_FILES=true" >> "$BASH_ENV"; else echo "export HAS_CHANGED_FILES=false" >> "$BASH_ENV"; fi
            echo "===== DELTA PACKAGE ====="
            cat delta/package/package.xml 2>/dev/null || true
            echo "===== CHANGED FILES ====="
            cat reports/changed-files.txt

      - run:
          name: Salesforce PMD Scan
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            mkdir -p pmd-output

            DELTA_PATH="delta/force-app/main/default"
            if [ "${HAS_DELTA:-false}" = "true" ] && [ -d "$DELTA_PATH" ] && find "$DELTA_PATH" -type f | grep -q .; then
              TARGET_PATH="$DELTA_PATH"
              echo "Running PMD on delta metadata."
            else
              TARGET_PATH="force-app/main/default"
              echo "Running PMD on the full source directory."
            fi

            SCAN_STATUS=0
            sf scanner run --engine pmd --target "$TARGET_PATH" --format json --outfile pmd-output/pmd-report.json --severity-threshold 3 || SCAN_STATUS=$?
            HTML_STATUS=0
            sf scanner run --engine pmd --target "$TARGET_PATH" --format html --outfile pmd-output/pmd-report.html --severity-threshold 3 || HTML_STATUS=$?

            if [ "$SCAN_STATUS" -eq 0 ] && [ "$HTML_STATUS" -ne 0 ]; then SCAN_STATUS="$HTML_STATUS"; fi
            echo "export PMD_SCAN_STATUS='$SCAN_STATUS'" >> "$BASH_ENV"
            echo "PMD scan exit status: $SCAN_STATUS"

      - store_artifacts:
          path: pmd-output
          destination: PMDReports
          when: always

      - run:
          name: Enforce PMD Scan Result
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            if [ "${PMD_SCAN_STATUS:-1}" -ne 0 ]; then echo "PMD scan failed or exceeded its configured severity threshold."; exit 1; fi
            echo "PMD scan passed."

      - run:
          name: Create JWT Key and Authenticate Salesforce
          command: |
            set -euo pipefail
            source "$BASH_ENV"

            case "$TARGET_ENVIRONMENT" in
              qa) CLIENT_ID="${SF_QA_CLIENT_ID:?Missing SF_QA_CLIENT_ID}"; USERNAME="${SF_QA_USERNAME:?Missing SF_QA_USERNAME}"; INSTANCE_URL="${SF_QA_INSTANCE_URL:?Missing SF_QA_INSTANCE_URL}"; KEY_B64="${JWT_KEY_QA:?Missing JWT_KEY_QA}" ;;
              uat) CLIENT_ID="${SF_UAT_CLIENT_ID:?Missing SF_UAT_CLIENT_ID}"; USERNAME="${SF_UAT_USERNAME:?Missing SF_UAT_USERNAME}"; INSTANCE_URL="${SF_UAT_INSTANCE_URL:?Missing SF_UAT_INSTANCE_URL}"; KEY_B64="${JWT_KEY_UAT:?Missing JWT_KEY_UAT}" ;;
              prod) CLIENT_ID="${SF_PROD_CLIENT_ID:?Missing SF_PROD_CLIENT_ID}"; USERNAME="${SF_PROD_USERNAME:?Missing SF_PROD_USERNAME}"; INSTANCE_URL="${SF_PROD_INSTANCE_URL:?Missing SF_PROD_INSTANCE_URL}"; KEY_B64="${JWT_KEY_PROD:?Missing JWT_KEY_PROD}" ;;
              *) echo "Unknown environment: $TARGET_ENVIRONMENT"; exit 1 ;;
            esac

            printf '%s' "$KEY_B64" | base64 --decode > circleci.key
            chmod 600 circleci.key
            sf org login jwt --client-id "$CLIENT_ID" --jwt-key-file circleci.key --username "$USERNAME" --instance-url "$INSTANCE_URL" --alias targetorg
            sf org display --target-org targetorg

      - run:
          name: Validate PR or Deploy Changes
          command: |
            set -euo pipefail
            source "$BASH_ENV"

            if [ "$HAS_DELTA" != "true" ] && [ "$HAS_DESTRUCTIVE" != "true" ] && [ "$HAS_CHANGED_FILES" != "true" ]; then
              echo "No Salesforce changes detected."
              exit 0
            fi

            TEST_LEVEL="<< parameters.test_level >>"
            if [ "$TARGET_ENVIRONMENT" != "prod" ] && [ "$HAS_DELTA" = "true" ] && grep -E -q '<name>(ApexClass|ApexTrigger)</name>' delta/package/package.xml; then
              TEST_LEVEL="RunLocalTests"
            fi

            ARGS=(--target-org targetorg --wait 1000 --verbose --ignore-conflicts)
            if [ "$HAS_DELTA" = "true" ]; then ARGS+=(--manifest delta/package/package.xml); else ARGS+=(--source-dir force-app); fi
            ARGS+=(--test-level "$TEST_LEVEL")
            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then ARGS+=(--tests EpicAccountContactRelationBatchTest --tests EpicActivityUpdateBatchTest); fi
            if [ -f delta/destructiveChanges/preDestructiveChanges.xml ]; then ARGS+=(--pre-destructive-changes delta/destructiveChanges/preDestructiveChanges.xml); fi
            if [ -f delta/destructiveChanges/postDestructiveChanges.xml ]; then ARGS+=(--post-destructive-changes delta/destructiveChanges/postDestructiveChanges.xml); fi

            if [ "$PIPELINE_MODE" = "validate" ]; then
              echo "Running Salesforce dry-run validation against $TARGET_ENVIRONMENT."
              sf project deploy start "${ARGS[@]}" --dry-run
            else
              echo "Deploying changes to $TARGET_ENVIRONMENT."
              sf project deploy start "${ARGS[@]}"
            fi

      - run:
          name: Remove JWT Key
          when: always
          command: rm -f circleci.key

      - store_artifacts:
          path: reports
          destination: SalesforceReports
          when: always

      - store_artifacts:
          path: delta
          destination: SalesforceDelta
          when: always

workflows:
  pull_request_validation:
    jobs:
      - deploy:
          name: validate-pr
          mode: validate
          environment: auto
          test_level: NoTestRun
          filters:
            branches:
              only:
                - /feature\/.*/
                - /release\/.*/
                - /sprint\/.*/
                - /HotFix\/.*/

  deploy_qa:
    jobs:
      - deploy:
          name: deploy-qa
          mode: deploy
          environment: qa
          test_level: NoTestRun
          filters:
            branches:
              only: qa

  deploy_uat:
    jobs:
      - deploy:
          name: deploy-uat
          mode: deploy
          environment: uat
          test_level: RunLocalTests
          filters:
            branches:
              only: uat

  deploy_production:
    jobs:
      - deploy:
          name: validate-production
          mode: validate
          environment: prod
          test_level: RunSpecifiedTests
          filters:
            branches:
              only: main

      - approve-prod:
          type: approval
          requires:
            - validate-production
          filters:
            branches:
              only: main

      - deploy:
          name: deploy-prod
          mode: deploy
          environment: prod
          test_level: RunSpecifiedTests
          requires:
            - approve-prod
          filters:
            branches:
              only: main
