version: 2.1

jobs:
  deploy:
    parameters:
      environment:
        type: enum
        enum: ["auto", "dev", "qa", "uat", "prod"]
      mode:
        type: enum
        enum: ["validate", "deploy"]
    docker:
      - image: cimg/node:22.17

    working_directory: ~/project

    steps:
      - checkout

      # -----------------------------------------------
      # 1. INSTALL SALESFORCE CLI AND REQUIRED TOOLS
      # -----------------------------------------------

      - run:
          name: Install Salesforce CLI and Tools
          command: |
            set -euo pipefail

            # Install Salesforce CLI
            sudo npm install -g @salesforce/cli@2.143.6

            # Install Java and jq
            sudo apt-get update -qq
            sudo apt-get install -y openjdk-17-jdk jq

            # Configure Java
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            export PATH="$JAVA_HOME/bin:$PATH"

            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"

            # Configure trusted unsigned plugins
            mkdir -p "$HOME/.config/sf"

            printf '%s\n' \
              '["sfdx-git-delta","@salesforce/plugin-code-analyzer"]' \
              > "$HOME/.config/sf/unsignedPluginAllowList.json"

            # Install required plugins
            sf plugins install sfdx-git-delta
            sf plugins install @salesforce/plugin-code-analyzer

            # Verify installations
            sf --version
            sf plugins
            java -version
            sf code-analyzer --help

      # -----------------------------------------------
      #  2. IDENTIFY PR TARGET AND SALESFORCE ENVIRONMENT
      # -----------------------------------------------
      - run:
          name: Identify PR Target And Salesforce Environment
          command: |
            set -euo pipefail

            MODE="<< parameters.mode >>"
            ENVIRONMENT="<< parameters.environment >>"

            # Safety guard: deployment is allowed only from its matching
            # protected target branch. Feature-branch deployment is skipped.
            if [ "$MODE" = "deploy" ]; then
              case "${CIRCLE_BRANCH:-}:$ENVIRONMENT" in
                dev:dev|qa:qa|uat:uat|main:prod)
                  echo "Approved deployment branch: $CIRCLE_BRANCH"
                  ;;
                feature/*:*)
                  echo "Feature branch detected ($CIRCLE_BRANCH). Skipping deployment job steps."
                  circleci-agent step halt
                  exit 0
                  ;;
                *)
                  echo "ERROR: Deployment is not permitted from branch '${CIRCLE_BRANCH:-unknown}' to environment '$ENVIRONMENT'."
                  exit 1
                  ;;
              esac
            fi

            IS_PR="false"
            BASE_BRANCH=""

            if [ "$MODE" = "validate" ] &&
               [ "$ENVIRONMENT" = "auto" ]; then

              if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
                echo "ERROR: A pull request URL is required for auto validation."
                echo "Ensure CircleCI is configured to build pull requests."
                exit 1
              fi

              
              # Get the target branch directly from CircleCI GitHub App event
              BASE_BRANCH="<< pipeline.event.github.pull_request.base.ref >>"

              if [ -z "$BASE_BRANCH" ] || [ "$BASE_BRANCH" = "<nil>" ]; then
                echo "ERROR: Unable to identify PR target branch."
                exit 1
              fi

              echo "Pull Request target branch: $BASE_BRANCH"


              case "$BASE_BRANCH" in
                dev|qa|uat|main)
                  IS_PR="true"
                  ;;
                *)
                  echo "PR targets '${BASE_BRANCH}'."
                  echo "Skipping validation for unsupported target branch."
                  circleci-agent step halt
                  exit 0
                  ;;
              esac

              case "$BASE_BRANCH" in
                dev) ENVIRONMENT="dev" ;;
                qa) ENVIRONMENT="qa" ;;
                uat) ENVIRONMENT="uat" ;;
                main) ENVIRONMENT="prod" ;;
              esac

            else
              case "$ENVIRONMENT" in
                dev) BASE_BRANCH="dev" ;;
                qa) BASE_BRANCH="qa" ;;
                uat) BASE_BRANCH="uat" ;;
                prod) BASE_BRANCH="main" ;;
                *)
                  echo "ERROR: Unsupported environment: $ENVIRONMENT"
                  exit 1
                  ;;
              esac
            fi

            {
              echo "export PIPELINE_MODE='${MODE}'"
              echo "export TARGET_ENVIRONMENT='${ENVIRONMENT}'"
              echo "export BASE_BRANCH='${BASE_BRANCH}'"
              echo "export IS_PR='${IS_PR}'"
            } >> "$BASH_ENV"

            echo "Pipeline mode: ${MODE}"
            echo "Target environment: ${ENVIRONMENT}"
            echo "Base branch: ${BASE_BRANCH}"
            echo "Pull request validation: ${IS_PR}"

      # -----------------------------------------------
      # 3. FETCH HISTORY AND GENERATE DELTA
      # -----------------------------------------------
      - run:
          name: Generate Salesforce Delta
          command: |
            set -euo pipefail

            mkdir -p delta

            # PR validation compares the PR head with its target branch.
            # Post-merge push deployments compare the new target-branch commit
            # with its first parent (works with merge-commit and squash merges).
            git fetch origin --prune

            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow origin
            fi

            if [ "$IS_PR" = "true" ]; then
              git fetch origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
              FROM_COMMIT=$(git merge-base HEAD "origin/${BASE_BRANCH}")
            else
              if ! git rev-parse HEAD^ >/dev/null 2>&1; then
                echo "ERROR: Previous commit not found; cannot safely generate a delta."
                exit 1
              fi
              FROM_COMMIT=$(git rev-parse HEAD^)
            fi

            echo "Comparing ${FROM_COMMIT} with HEAD ($(git rev-parse HEAD))"

            sf sgd source delta \
              --from "$FROM_COMMIT" \
              --to HEAD \
              --output-dir delta \
              --source-dir force-app/main/default \
              --generate-delta

            echo "===== GENERATED PACKAGE.XML ====="
            if [ -f delta/package/package.xml ]; then
              cat delta/package/package.xml
            else
              echo "No package.xml generated."
            fi

            HAS_DELTA="false"
            HAS_CHANGES="false"

            if [ -f delta/package/package.xml ] && \
               grep -q "<members>" delta/package/package.xml; then
              HAS_DELTA="true"
              HAS_CHANGES="true"
            fi

            for FILE in \
              delta/destructiveChanges/destructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPre.xml \
              delta/destructiveChanges/destructiveChangesPost.xml \
              delta/destructiveChanges/preDestructiveChanges.xml \
              delta/destructiveChanges/postDestructiveChanges.xml
            do
              if [ -s "$FILE" ]; then
                HAS_CHANGES="true"
              fi
            done

            {
              echo "export HAS_DELTA='${HAS_DELTA}'"
              echo "export HAS_CHANGES='${HAS_CHANGES}'"
              echo "export FROM_COMMIT='${FROM_COMMIT}'"
            } >> "$BASH_ENV"

            echo "HAS_DELTA=${HAS_DELTA}"
            echo "HAS_CHANGES=${HAS_CHANGES}"

      # -----------------------------------------------
      # 6. SELECT APEX TEST LEVEL FROM COMMIT MESSAGES
      # -----------------------------------------------
      - run:
          name: Select Apex Tests From Commit Message
          command: |
            set -euo pipefail

            # -----------------------------------------------
            # 1. SET DEFAULT TEST LEVEL BASED ON ENVIRONMENT
            # -----------------------------------------------

            case "$TARGET_ENVIRONMENT" in
              dev) DEFAULT_TEST_LEVEL="NoTestRun" ;;
              qa|uat|prod) DEFAULT_TEST_LEVEL="RunLocalTests" ;;
              *) echo "ERROR: Unsupported environment: $TARGET_ENVIRONMENT"; exit 1 ;;
            esac

            # -----------------------------------------------
            # 2. VERIFY COMMIT RANGE
            # -----------------------------------------------

            if [ -z "${FROM_COMMIT:-}" ]; then
              echo "ERROR: FROM_COMMIT is not available for test selection."
              exit 1
            fi

            echo "============================================"
            echo "APEX TEST SELECTION"
            echo "============================================"
            echo "Target environment: $TARGET_ENVIRONMENT"
            echo "From commit: $FROM_COMMIT"
            echo "Current commit: $(git rev-parse HEAD)"

            # -----------------------------------------------
            # 3. COLLECT TEST DIRECTIVES FROM ALL COMMITS
            # -----------------------------------------------

            mapfile -t TEST_TOKENS < <(
              git log --format=%B "${FROM_COMMIT}..HEAD" |
              grep -oE '\[TEST=[^]]+\]' || true
            )

            echo "Detected test directives:"
            printf '%s\n' "${TEST_TOKENS[@]}"

            # -----------------------------------------------
            # 4. PROCESS TEST DIRECTIVES
            # -----------------------------------------------

            SELECTED_MODE=""
            declare -A SELECTED_CLASSES=()

            for TOKEN in "${TEST_TOKENS[@]}"; do

              VALUE="${TOKEN#\[TEST=}"
              VALUE="${VALUE%\]}"
              VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"

              case "${VALUE^^}" in

                NONE|SKIP)

                  # Ignore NONE/SKIP directives only for production.
                  if [ "$TARGET_ENVIRONMENT" = "prod" ]; then
                    echo "WARNING: Ignoring $TOKEN for production."
                    continue
                  fi

                  if [ -n "$SELECTED_MODE" ] && [ "$SELECTED_MODE" != "NoTestRun" ]; then
                    echo "ERROR: Conflicting [TEST=...] directives found in commits."
                    exit 1
                  fi

                  SELECTED_MODE="NoTestRun"
                  ;;

                ALL)

                  if [ -n "$SELECTED_MODE" ] && [ "$SELECTED_MODE" != "RunLocalTests" ]; then
                    echo "ERROR: Conflicting [TEST=...] directives found in commits."
                    exit 1
                  fi

                  SELECTED_MODE="RunLocalTests"
                  ;;

                *)

                  # Validate specified Apex test class names.
                  if ! [[ "$VALUE" =~ ^[A-Za-z_][A-Za-z0-9_]*(,[A-Za-z_][A-Za-z0-9_]*)*$ ]]; then
                    echo "ERROR: Invalid test directive: $TOKEN"
                    echo "Use [TEST=NONE], [TEST=SKIP], [TEST=ALL], or [TEST=ClassA,ClassB]."
                    exit 1
                  fi

                  if [ -n "$SELECTED_MODE" ] && [ "$SELECTED_MODE" != "RunSpecifiedTests" ]; then
                    echo "ERROR: Conflicting [TEST=...] directives found in commits."
                    exit 1
                  fi

                  SELECTED_MODE="RunSpecifiedTests"

                  # Collect and deduplicate all specified test classes.
                  IFS=',' read -r -a CLASS_NAMES < <(printf '%s' "$VALUE")

                  for CLASS_NAME in "${CLASS_NAMES[@]}"; do
                    SELECTED_CLASSES["$CLASS_NAME"]=1
                  done
                  ;;

              esac

            done

            # -----------------------------------------------
            # 5. DETERMINE FINAL TEST LEVEL
            # -----------------------------------------------

            TEST_LEVEL="${SELECTED_MODE:-$DEFAULT_TEST_LEVEL}"
            TEST_CLASSES_CSV=""

            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then

              TEST_CLASSES_CSV="$(
                printf '%s\n' "${!SELECTED_CLASSES[@]}" | sort | paste -sd, -
              )"

              if [ -z "$TEST_CLASSES_CSV" ]; then
                echo "ERROR: RunSpecifiedTests selected without any test classes."
                exit 1
              fi

            fi

            # -----------------------------------------------
            # 6. PRODUCTION SAFETY CHECK
            # -----------------------------------------------

            if [ "$TARGET_ENVIRONMENT" = "prod" ] && [ "$TEST_LEVEL" = "NoTestRun" ]; then
              echo "ERROR: NoTestRun is not permitted for production deployments."
              exit 1
            fi

            # -----------------------------------------------
            # 7. EXPORT VARIABLES FOR NEXT CIRCLECI STEPS
            # -----------------------------------------------

            {
              echo "export TEST_LEVEL='${TEST_LEVEL}'"
              echo "export TEST_CLASSES_CSV='${TEST_CLASSES_CSV}'"
            } >> "$BASH_ENV"

            # -----------------------------------------------
            # 8. DISPLAY FINAL TEST SELECTION
            # -----------------------------------------------

            echo "============================================"
            echo "FINAL APEX TEST SELECTION"
            echo "============================================"

            echo "Target environment: $TARGET_ENVIRONMENT"
            echo "Selected Apex test level: $TEST_LEVEL"

            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
              echo "Selected Apex test classes: $TEST_CLASSES_CSV"
            fi

            if [ "${#TEST_TOKENS[@]}" -eq 0 ]; then
              echo "No commit test directive found; using environment default."
            else
              echo "Processed commit directives:"
              printf '%s\n' "${TEST_TOKENS[@]}"
            fi

            echo "============================================"

      # -----------------------------------------------
      # 7. AUTHENTICATE TO THE TARGET ORG
      # -----------------------------------------------
      - run:
          name: Authenticate Salesforce with JWT
          command: |
            set -euo pipefail

            case "$TARGET_ENVIRONMENT" in
              dev) USERNAME_ENV="SF_DEV_USERNAME"; CLIENT_ID_ENV="SF_DEV_CLIENT_ID"; INSTANCE_URL_ENV="SF_DEV_INSTANCE_URL"; JWT_ENV="JWT_KEY_DEV" ;;
              qa) USERNAME_ENV="SF_QA_USERNAME"; CLIENT_ID_ENV="SF_QA_CLIENT_ID"; INSTANCE_URL_ENV="SF_QA_INSTANCE_URL"; JWT_ENV="JWT_KEY_QA" ;;
              uat) USERNAME_ENV="SF_UAT_USERNAME"; CLIENT_ID_ENV="SF_UAT_CLIENT_ID"; INSTANCE_URL_ENV="SF_UAT_INSTANCE_URL"; JWT_ENV="JWT_KEY_UAT" ;;
              prod) USERNAME_ENV="SF_PROD_USERNAME"; CLIENT_ID_ENV="SF_PROD_CLIENT_ID"; INSTANCE_URL_ENV="SF_PROD_INSTANCE_URL"; JWT_ENV="JWT_KEY_PROD" ;;
              *) echo "ERROR: Unsupported target environment."; exit 1 ;;
            esac

            USERNAME="${!USERNAME_ENV:-}"
            CLIENT_ID="${!CLIENT_ID_ENV:-}"
            INSTANCE_URL="${!INSTANCE_URL_ENV:-}"
            JWT_B64="${!JWT_ENV:-}"

            if [ -z "$USERNAME" ] ||
               [ -z "$CLIENT_ID" ] ||
               [ -z "$INSTANCE_URL" ] ||
               [ -z "$JWT_B64" ]; then
              echo "ERROR: One or more Salesforce environment variables are missing."
              exit 1
            fi

            KEY_FILE="$PWD/circleci.key"

            printf '%s' "$JWT_B64" | base64 --decode > "$KEY_FILE"
            chmod 600 "$KEY_FILE"

            ORGALIAS="targetorg"

            echo "============================================"
            echo "SALESFORCE JWT AUTHENTICATION"
            echo "============================================"
            echo "Authenticating Salesforce user: $USERNAME"
            echo "Target instance URL: $INSTANCE_URL"

            sf org login jwt \
              --client-id "$CLIENT_ID" \
              --jwt-key-file "$KEY_FILE" \
              --username "$USERNAME" \
              --instance-url "$INSTANCE_URL" \
              --alias "$ORGALIAS"

            echo ""
            echo "JWT authentication successful."
            echo "Authenticated Org Alias: $ORGALIAS"
            echo "Verifying authenticated Salesforce org..."

            sf org display --target-org "$ORGALIAS" || {
              echo "ERROR: Salesforce org authentication verification failed."
              exit 1
            }

            echo "Salesforce authentication verification completed."
            rm -f "$KEY_FILE"

      # -----------------------------------------------
      # 8. SALESFORCE DRY-RUN VALIDATION
      # -----------------------------------------------
      - run:
          name: Salesforce Dry-Run Validation
          command: |
            set -euo pipefail

            if [ "$PIPELINE_MODE" != "validate" ]; then
              echo "Skipping validation. Mode: $PIPELINE_MODE"
              exit 0
            fi

            PKG_FILE="delta/package/package.xml"
            PRE_XML=""
            POST_XML=""
            DEPLOY_ARGS=()

            echo "============================================"
            echo "SALESFORCE DRY-RUN VALIDATION"
            echo "============================================"

            echo "Environment : $TARGET_ENVIRONMENT"
            echo "Mode        : $PIPELINE_MODE"

            # TEST_LEVEL and TEST_CLASSES_CSV are selected once in the
            # preceding step and reused for validation and actual deployment.
            echo "Apex test level: $TEST_LEVEL"
            echo "Apex test classes: ${TEST_CLASSES_CSV:-none}"

            # ---------------------------------------
            # Detect pre-destructive changes
            # ---------------------------------------
            for FILE in \
              delta/destructiveChanges/preDestructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPre.xml
            do
              if [ -s "$FILE" ]; then
                PRE_XML="$FILE"
                break
              fi
            done

            # ---------------------------------------
            # Detect post-destructive changes
            # ---------------------------------------
            for FILE in \
              delta/destructiveChanges/postDestructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPost.xml \
              delta/destructiveChanges/destructiveChanges.xml
            do
              if [ -s "$FILE" ]; then
                POST_XML="$FILE"
                break
              fi
            done

            # ---------------------------------------
            # Check whether destructive changes exist
            # ---------------------------------------
            HAS_PRE_DESTRUCTIVE="false"
            HAS_POST_DESTRUCTIVE="false"

            if [ -n "$PRE_XML" ]; then
              HAS_PRE_DESTRUCTIVE="true"
            fi

            if [ -n "$POST_XML" ]; then
              HAS_POST_DESTRUCTIVE="true"
            fi

            # ---------------------------------------
            # Prepare deployment arguments
            # ---------------------------------------

            if [ "$HAS_PRE_DESTRUCTIVE" = "true" ] || \
               [ "$HAS_POST_DESTRUCTIVE" = "true" ]; then

              echo "Destructive changes detected."

              if [ ! -s "$PKG_FILE" ]; then
                echo "ERROR: Destructive changes require a valid package.xml."
                exit 1
              fi

              DEPLOY_ARGS=(--manifest "$PKG_FILE")

            elif [ -f "$PKG_FILE" ] && \
                 grep -Eq '<members>[^<]+</members>' "$PKG_FILE"; then

              echo "Using generated delta package.xml."

              DEPLOY_ARGS=(--manifest "$PKG_FILE")

            elif [ -d "delta/force-app/main/default" ] && \
                 find delta/force-app/main/default -type f -print -quit | grep -q .; then

              echo "Using generated delta source directory."

              DEPLOY_ARGS=(--source-dir delta/force-app/main/default)

            else

              echo "No deployable Salesforce metadata changes found."
              echo "Skipping dry-run validation successfully."
              exit 0

            fi

            # ---------------------------------------
            # Add destructive change arguments
            # ---------------------------------------

            if [ -n "$PRE_XML" ]; then
              DEPLOY_ARGS+=(--pre-destructive-changes "$PRE_XML")
              echo "Pre-destructive changes: $PRE_XML"
            fi

            if [ -n "$POST_XML" ]; then
              DEPLOY_ARGS+=(--post-destructive-changes "$POST_XML")
              echo "Post-destructive changes: $POST_XML"
            fi

            # ---------------------------------------
            # Execute Salesforce dry-run validation
            # ---------------------------------------

            echo "Starting Salesforce dry-run validation..."

            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
              IFS=',' read -r -a CLASS_NAMES < <(printf '%s' "$VALUE")   
              sf project deploy start "${DEPLOY_ARGS[@]}" --target-org targetorg --test-level RunSpecifiedTests --tests "${TEST_CLASSES[@]}" --dry-run --wait 800 --ignore-warnings --verbose
            else
              sf project deploy start "${DEPLOY_ARGS[@]}" --target-org targetorg --test-level "$TEST_LEVEL" --dry-run --wait 800 --ignore-warnings --verbose
            fi

            echo "============================================"
            echo "SUCCESS: Salesforce dry-run validation completed."
            echo "============================================"

      # -----------------------------------------------
      # 9. SALESFORCE ACTUAL DEPLOYMENT
      # -----------------------------------------------
      - run:
          name: Salesforce Actual Deployment
          command: |
            set -euo pipefail

            if [ "$PIPELINE_MODE" != "deploy" ]; then
              echo "Skipping deployment. Mode: $PIPELINE_MODE"
              exit 0
            fi

            # Final deployment safety check. Never deploy from feature branches
            # or deploy to an environment that does not match the branch.
            case "${CIRCLE_BRANCH:-}:$TARGET_ENVIRONMENT" in
              dev:dev|qa:qa|uat:uat|main:prod)
                echo "Deployment branch/environment check passed."
                ;;
              feature/*:*)
                echo "Feature branch detected ($CIRCLE_BRANCH). Skipping Salesforce deployment."
                circleci-agent step halt
                exit 0
                ;;
              *)
                echo "ERROR: Branch '${CIRCLE_BRANCH:-unknown}' cannot deploy to '$TARGET_ENVIRONMENT'."
                exit 1
                ;;
            esac

            PKG_FILE="delta/package/package.xml"
            PRE_XML=""
            POST_XML=""
            DEPLOY_ARGS=()

            echo "============================================"
            echo "SALESFORCE ACTUAL DEPLOYMENT"
            echo "============================================"

            echo "Environment : $TARGET_ENVIRONMENT"
            echo "Mode        : $PIPELINE_MODE"

            # Reuse the exact test selection used by dry-run validation.
            echo "Selected Apex test level: $TEST_LEVEL"
            echo "Selected Apex test classes: ${TEST_CLASSES_CSV:-none}"

            # ---------------------------------------
            # Detect pre-destructive changes
            # ---------------------------------------
            for FILE in \
              delta/destructiveChanges/preDestructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPre.xml
            do
              if [ -s "$FILE" ]; then
                PRE_XML="$FILE"
                break
              fi
            done

            # ---------------------------------------
            # Detect post-destructive changes
            # ---------------------------------------
            for FILE in \
              delta/destructiveChanges/postDestructiveChanges.xml \
              delta/destructiveChanges/destructiveChangesPost.xml \
              delta/destructiveChanges/destructiveChanges.xml
            do
              if [ -s "$FILE" ]; then
                POST_XML="$FILE"
                break
              fi
            done

            # ---------------------------------------
            # Check whether destructive changes exist
            # ---------------------------------------
            HAS_PRE_DESTRUCTIVE="false"
            HAS_POST_DESTRUCTIVE="false"

            if [ -n "$PRE_XML" ]; then
              HAS_PRE_DESTRUCTIVE="true"
            fi

            if [ -n "$POST_XML" ]; then
              HAS_POST_DESTRUCTIVE="true"
            fi

            # ---------------------------------------
            # Prepare deployment arguments
            # ---------------------------------------

            if [ "$HAS_PRE_DESTRUCTIVE" = "true" ] || \
               [ "$HAS_POST_DESTRUCTIVE" = "true" ]; then

              echo "Destructive changes detected."

              if [ ! -s "$PKG_FILE" ]; then
                echo "ERROR: Destructive changes require a valid package.xml."
                exit 1
              fi

              DEPLOY_ARGS=(--manifest "$PKG_FILE")

            elif [ -f "$PKG_FILE" ] && \
                 grep -Eq '<members>[^<]+</members>' "$PKG_FILE"; then

              echo "Using generated delta package.xml."

              DEPLOY_ARGS=(--manifest "$PKG_FILE")

            elif [ -d "delta/force-app/main/default" ] && \
                 find delta/force-app/main/default -type f -print -quit | grep -q .; then

              echo "Using generated delta source directory."

              DEPLOY_ARGS=(--source-dir delta/force-app/main/default)

            else

              echo "No deployable Salesforce metadata changes found."
              echo "Skipping actual deployment successfully."
              exit 0

            fi

            # ---------------------------------------
            # Add destructive change arguments
            # ---------------------------------------

            if [ -n "$PRE_XML" ]; then
              DEPLOY_ARGS+=(--pre-destructive-changes "$PRE_XML")
              echo "Pre-destructive changes: $PRE_XML"
            fi

            if [ -n "$POST_XML" ]; then
              DEPLOY_ARGS+=(--post-destructive-changes "$POST_XML")
              echo "Post-destructive changes: $POST_XML"
            fi

            # ---------------------------------------
            # Execute actual Salesforce deployment
            # ---------------------------------------

            echo "Starting Salesforce actual deployment..."

            if [ "$TEST_LEVEL" = "RunSpecifiedTests" ]; then
              IFS=',' read -r -a TEST_CLASSES < <(printf '%s' "$TEST_CLASSES_CSV")
              sf project deploy start "${DEPLOY_ARGS[@]}" --target-org targetorg --test-level RunSpecifiedTests --tests "${TEST_CLASSES[@]}" --wait 800 --ignore-warnings --verbose
            else
              sf project deploy start "${DEPLOY_ARGS[@]}" --target-org targetorg --test-level "$TEST_LEVEL" --wait 800 --ignore-warnings --verbose
            fi

            echo "============================================"
            echo "SUCCESS: Salesforce deployment completed."
            echo "============================================"

      # -----------------------------------------------
      # 10. CLEAN UP JWT KEY
      # -----------------------------------------------
      - run:
          name: Cleanup JWT Key
          when: always
          command: |
            rm -f circleci.key

workflows:
  # 1. PR validation: run for PR events only, never for the PR-merged (closed) event.
  pr-validation:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - not:
            equal: [closed, << pipeline.event.action >>]
    jobs:
      - deploy:
          name: validate-pull-request
          environment: auto
          mode: validate
          filters:
            branches:
              only:
                - dev
                - /feature\/.*/
                - /release\/.*/
                - /sprint\/.*/
                - /HotFix\/.*/

  # 2. Dev: post-merge PR to dev; approval followed by deployment.
  deploy-dev:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - equal: [closed, << pipeline.event.action >>]
        - equal: [true, << pipeline.event.github.pull_request.merged >>]
        - equal: [dev, << pipeline.git.branch >>]
    jobs:
      - approve-dev:
          type: approval
          filters:
            branches:
              only: dev

      - deploy:
          name: deploy-dev
          environment: dev
          mode: deploy
          requires:
            - approve-dev
          filters:
            branches:
              only: dev

  # 3. QA: post-merge PR to qa; approval followed by deployment.
  deploy-qa:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - equal: [closed, << pipeline.event.action >>]
        - equal: [true, << pipeline.event.github.pull_request.merged >>]
        - equal: [qa, << pipeline.git.branch >>]
    jobs:
      - approve-qa:
          type: approval
          filters:
            branches:
              only: qa

      - deploy:
          name: deploy-qa
          environment: qa
          mode: deploy
          requires:
            - approve-qa
          filters:
            branches:
              only: qa

  # 4. UAT: post-merge PR to uat; approval followed by deployment only.
  deploy-uat:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - equal: [closed, << pipeline.event.action >>]
        - equal: [true, << pipeline.event.github.pull_request.merged >>]
        - equal: [uat, << pipeline.git.branch >>]
    jobs:
      - approve-uat:
          type: approval
          filters:
            branches:
              only: uat

      - deploy:
          name: deploy-uat
          environment: uat
          mode: deploy
          requires:
            - approve-uat
          filters:
            branches:
              only: uat

  # 5. Production: post-merge PR to main; approval followed by deployment only.
  deploy-production:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - equal: [closed, << pipeline.event.action >>]
        - equal: [true, << pipeline.event.github.pull_request.merged >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - approve-prod:
          type: approval
          filters:
            branches:
              only: main

      - deploy:
          name: deploy-prod
          environment: prod
          mode: deploy
          requires:
            - approve-prod
          filters:
            branches:
              only: main
